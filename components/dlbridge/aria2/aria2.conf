# aria2 for the downloads service (the downloads folder is mounted at /downloads). Links added in the panel land in
# Files; the bridge sends torrents to Torrents and videos go to Videos.
dir=/downloads/Files
continue=true
input-file=/data/aria2.session
save-session=/data/aria2.session
save-session-interval=30

# The panel (AriaNg) and the bridge talk to it on the private Docker network only.
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-max-request-size=10M

# Like IDM: 8 connections per file, 5 downloads at a time. A server that refuses that many
# (429, 503) gets the same file again with 2, then 1 connection, from where it stopped (dlbridge).
max-concurrent-downloads=5
max-connection-per-server=8
split=8
min-split-size=4M
file-allocation=falloc
disk-cache=32M
auto-file-renaming=true
allow-overwrite=false
check-certificate=true
# Many sites refuse "aria2/1.37"; like IDM, present a normal browser.
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36
disable-ipv6=true
max-tries=5
retry-wait=10

# Torrents. No port is forwarded to the server, so it only connects out.
# Seeding stops at ratio 1.0 or after 12 hours, whichever comes first.
listen-port=51413
dht-listen-port=51413
enable-dht=true
dht-file-path=/data/dht.dat
# aria2 has no built-in way into the DHT network: without this, a magnet with no working
# tracker finds nobody. Public trackers are added to every torrent for the same reason.
dht-entry-point=dht.transmissionbt.com:6881
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,udp://open.demonii.com:1337/announce,https://tracker.gbitt.info:443/announce
enable-peer-exchange=true
bt-enable-lpd=false
bt-max-peers=80
seed-ratio=1.0
seed-time=720
follow-torrent=true
bt-save-metadata=true
bt-load-saved-metadata=true

console-log-level=warn
summary-interval=0
show-console-readout=false
