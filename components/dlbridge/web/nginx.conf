# The download panel (AriaNg, static files) and aria2's RPC behind it, on one address:
# download.<your domain>, behind Cloudflare Access. The panel reaches aria2 at /jsonrpc.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # .torrent files are sent inside the RPC call, base64.
    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /jsonrpc {
        proxy_pass http://aria2:6800/jsonrpc;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
