# Passwords. password.DOMAIN -> 127.0.0.1:8222, NOT behind Access (the Bitwarden apps cannot pass it):
# signups off, a country rule, 2FA, and Access on /admin only (references/cloudflare.md).
name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ./data:/data
