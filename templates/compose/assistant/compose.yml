# The assistant's core: n8n, its Postgres (n8n's own database and the assistant's), WAHA (WhatsApp on the
# assistant's second number) and the file bridge. All on the "assistant" network (see references/network.md).
# Never publish WAHA: only n8n and the file bridge talk to it.
name: assistant
services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD}   # read once by initdb/10-assistant.sh
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      retries: 10
    networks: [assistant]

  n8n:
    image: n8nio/n8n:2.42.6
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}      # never change it: stored credentials depend on it
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"                 # hours: two weeks of run history
    ports:
      - "127.0.0.1:5678:5678"    # the tunnel and scripts on the server
      - "172.17.0.1:5678:5678"   # isolated containers allowed to call n8n (jc-isolate exceptions)
    volumes:
      - ./n8n:/home/node/.n8n
    networks: [assistant]

  waha:
    image: devlikeapro/waha:gows-2026.9.2
    container_name: waha
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"    # for you, on the server only (pairing, status)
    volumes:
      - ./waha-sessions:/app/.sessions
    networks: [assistant]

  filebridge:
    build: ${JC_SRC:-/opt/junkyard/src}/components/filebridge
    image: junkyard/filebridge:1
    container_name: filebridge
    restart: unless-stopped
    env_file: filebridge.env
    environment:
      TZ: ${TZ}
    volumes:
      - ./filebridge:/data            # owned by uid 10002
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [assistant]

networks:
  assistant:
    external: true
